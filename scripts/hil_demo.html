<!doctype html>
<html lang="en" class="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AutoQrpt · Post-Quantum Automotive OTA Gateway (PQC-02)</title>

  <!-- Fonts: Geist & Geist Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Geist', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
            mono: ['Geist Mono', 'ui-monospace', 'monospace'],
          }
        }
      }
    }
  </script>

  <!-- React 18 & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel Standalone -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>

  <style>
    html, body {
      background-color: #09090b;
      color: #fafafa;
      font-family: 'Geist', -apple-system, BlinkMacSystemFont, sans-serif;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
      scroll-behavior: smooth;
      -webkit-font-smoothing: antialiased;
    }
    .tabular-nums {
      font-variant-numeric: tabular-nums;
    }
    .bg-grid-subtle {
      background-size: 40px 40px;
      background-image:
        linear-gradient(to right, rgba(255, 255, 255, 0.025) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.025) 1px, transparent 1px);
    }
    @keyframes pulseDot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.45; transform: scale(0.92); }
    }
    .pulse-dot {
      animation: pulseDot 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }

    /* Hero Staggered Entrance Animations */
    @keyframes heroEnter {
      from {
        opacity: 0;
        transform: translateY(22px);
        filter: blur(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
        filter: blur(0);
      }
    }
    .anim-hero-1 { animation: heroEnter 0.75s cubic-bezier(0.16, 1, 0.3, 1) 0.05s both; }
    .anim-hero-2 { animation: heroEnter 0.75s cubic-bezier(0.16, 1, 0.3, 1) 0.16s both; }
    .anim-hero-3 { animation: heroEnter 0.75s cubic-bezier(0.16, 1, 0.3, 1) 0.28s both; }
    .anim-hero-4 { animation: heroEnter 0.75s cubic-bezier(0.16, 1, 0.3, 1) 0.40s both; }
    .anim-hero-5 { animation: heroEnter 0.85s cubic-bezier(0.16, 1, 0.3, 1) 0.22s both; }

    /* Animated Packet Stream Flow */
    @keyframes packetFlow {
      0% { transform: translateY(-100%); opacity: 0; }
      30% { opacity: 1; }
      70% { opacity: 1; }
      100% { transform: translateY(220%); opacity: 0; }
    }
    .packet-pulse {
      animation: packetFlow 2.2s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }
    .packet-pulse-delay {
      animation: packetFlow 2.2s cubic-bezier(0.4, 0, 0.2, 1) 1.1s infinite;
    }

    @keyframes floatSlow {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-5px); }
    }
    .float-slow {
      animation: floatSlow 4.5s ease-in-out infinite;
    }

    @keyframes treeFlow {
      from { stroke-dashoffset: 100; }
      to { stroke-dashoffset: 0; }
    }
    .tree-edge-active {
      stroke-dasharray: 8 12;
      animation: treeFlow 1.4s linear infinite;
    }

    /* Distinct Scroll-Triggered Reveal Animations per Section */
    /* Block 2: Slide + Unblur from Left/Right */
    .reveal-slide-up {
      opacity: 0;
      transform: translateY(32px);
      filter: blur(6px);
      transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1),
                  transform 0.8s cubic-bezier(0.16, 1, 0.3, 1),
                  filter 0.8s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .reveal-slide-up.is-visible {
      opacity: 1;
      transform: translateY(0);
      filter: blur(0);
    }

    .reveal-slide-left {
      opacity: 0;
      transform: translateX(-36px);
      filter: blur(6px);
      transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1),
                  transform 0.8s cubic-bezier(0.16, 1, 0.3, 1),
                  filter 0.8s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .reveal-slide-left.is-visible {
      opacity: 1;
      transform: translateX(0);
      filter: blur(0);
    }

    .reveal-slide-right {
      opacity: 0;
      transform: translateX(36px) scale(0.97);
      filter: blur(6px);
      transition: opacity 0.85s cubic-bezier(0.16, 1, 0.3, 1),
                  transform 0.85s cubic-bezier(0.16, 1, 0.3, 1),
                  filter 0.85s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .reveal-slide-right.is-visible {
      opacity: 1;
      transform: translateX(0) scale(1);
      filter: blur(0);
    }

    /* Block 3: Threat Strip Wipe & Unfold */
    .reveal-strip {
      opacity: 0;
      transform: translateY(20px) scale(0.985);
      transition: opacity 0.7s cubic-bezier(0.16, 1, 0.3, 1),
                  transform 0.7s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .reveal-strip.is-visible {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    /* Block 4: Scale Pop for Telemetry Graphs */
    .reveal-pop {
      opacity: 0;
      transform: scale(0.92) translateY(28px);
      filter: blur(8px);
      transition: opacity 0.85s cubic-bezier(0.16, 1, 0.3, 1),
                  transform 0.85s cubic-bezier(0.16, 1, 0.3, 1),
                  filter 0.85s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .reveal-pop.is-visible {
      opacity: 1;
      transform: scale(1) translateY(0);
      filter: blur(0);
    }

    /* Animated Bar & Frame Cascade */
    .bar-anim {
      width: 0%;
      transition: width 1.15s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .frame-cell {
      opacity: 0.15;
      transform: scale(0.5);
      transition: opacity 0.4s ease, transform 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .telemetry-active .frame-cell {
      opacity: 1;
      transform: scale(1);
    }
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #09090b;
    }
    ::-webkit-scrollbar-thumb {
      background: #27272a;
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #3f3f46;
    }
  </style>
</head>
<body class="bg-zinc-950 text-zinc-100 antialiased selection:bg-zinc-800 selection:text-white">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // =========================================================================
    // 1. ICONS & BRAND ASSETS
    // =========================================================================
    function ShieldLogo({ className = "w-5 h-5" }) {
      return (
        <svg className={className} viewBox="0 0 32 32" fill="none">
          <path d="M16 3L5 7.5V15.5C5 22.8 9.7 29.5 16 31C22.3 29.5 27 22.8 27 15.5V7.5L16 3Z" fill="rgba(56,189,248,0.12)" stroke="#38BDF8" strokeWidth="1.75" strokeLinejoin="round" />
          <path d="M16 8L9.5 11.5V17C9.5 21.2 12.2 25.1 16 26.2C19.8 25.1 22.5 21.2 22.5 17V11.5L16 8Z" stroke="#E4E4E7" strokeWidth="1.25" strokeLinejoin="round" />
          <circle cx="16" cy="17" r="2.2" fill="#38BDF8" />
        </svg>
      );
    }

    function IconArrowRight({ className = "w-4 h-4" }) {
      return (
        <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <line x1="5" y1="12" x2="19" y2="12" />
          <polyline points="12 5 19 12 12 19" />
        </svg>
      );
    }

    function IconCheck({ className = "w-3.5 h-3.5" }) {
      return (
        <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round">
          <polyline points="20 6 9 17 4 12" />
        </svg>
      );
    }

    function IconX({ className = "w-3.5 h-3.5" }) {
      return (
        <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round">
          <line x1="18" y1="6" x2="6" y2="18" />
          <line x1="6" y1="6" x2="18" y2="18" />
        </svg>
      );
    }

    // =========================================================================
    // 2. SHADCN/UI COMPONENT PRIMITIVES
    // =========================================================================
    function Card({ className = "", children }) {
      return (
        <div className={`rounded-xl border border-zinc-800/80 bg-zinc-900/45 backdrop-blur-md text-zinc-100 shadow-sm ${className}`}>
          {children}
        </div>
      );
    }

    function CardTitle({ className = "", children }) {
      return <h3 className={`text-base sm:text-lg font-semibold leading-snug tracking-tight text-zinc-100 ${className}`}>{children}</h3>;
    }

    function CardDescription({ className = "", children }) {
      return <p className={`text-xs sm:text-sm text-zinc-400 leading-relaxed ${className}`}>{children}</p>;
    }

    function Badge({ variant = "default", className = "", children }) {
      const variants = {
        default: "border-zinc-700 bg-zinc-800/90 text-zinc-200",
        sky: "border-sky-500/30 bg-sky-500/10 text-sky-300",
        emerald: "border-emerald-500/30 bg-emerald-500/10 text-emerald-300",
        amber: "border-amber-500/30 bg-amber-500/10 text-amber-300",
        red: "border-red-500/30 bg-red-500/10 text-red-300",
        purple: "border-purple-500/30 bg-purple-500/10 text-purple-300",
      };
      return (
        <span className={`inline-flex items-center gap-1.5 rounded-full border px-2.5 py-0.5 font-mono text-[11px] font-medium tabular-nums ${variants[variant] || variants.default} ${className}`}>
          {children}
        </span>
      );
    }

    function Button({ variant = "primary", size = "default", className = "", disabled = false, onClick, children }) {
      const variants = {
        primary: "bg-zinc-100 text-zinc-950 hover:bg-white font-medium shadow-sm",
        secondary: "border border-zinc-800 bg-zinc-900/80 text-zinc-200 hover:bg-zinc-800 hover:text-white",
        emerald: "bg-emerald-600 text-white hover:bg-emerald-500 font-medium shadow-sm",
        red: "bg-red-600/90 text-white hover:bg-red-500 font-medium shadow-sm",
      };
      const sizes = {
        sm: "h-8 px-3 text-xs rounded-lg",
        default: "h-10 px-4 text-xs sm:text-sm rounded-lg",
        lg: "h-11 px-6 text-sm rounded-xl",
      };
      return (
        <button
          type="button"
          disabled={disabled}
          onClick={onClick}
          className={`inline-flex items-center justify-center gap-2 transition-all active:scale-[0.99] disabled:opacity-50 disabled:pointer-events-none ${variants[variant] || variants.primary} ${sizes[size] || sizes.default} ${className}`}
        >
          {children}
        </button>
      );
    }

    function Progress({ value = 0, colorClass = "bg-sky-400", className = "" }) {
      return (
        <div className={`w-full h-2 rounded-full bg-zinc-800/90 overflow-hidden ${className}`}>
          <div
            className={`h-full rounded-full transition-all duration-500 ${colorClass}`}
            style={{ width: `${Math.min(100, Math.max(0, value))}%` }}
          />
        </div>
      );
    }

    // =========================================================================
    // 3. TOP NAVIGATION HEADER & TELEGRAM MODAL
    // =========================================================================
    function TelegramModal({ open, onClose, tgStatus, onRefresh, onTestAlert, testFeedback, testing }) {
      if (!open) return null;
      const subs = tgStatus?.subscribers || [];
      return (
        <div
          className="fixed inset-0 z-[100] flex items-center justify-center bg-black/70 backdrop-blur-sm p-4"
          onClick={(e) => { if (e.target === e.currentTarget) onClose(); }}
        >
          <div className="w-full max-w-[485px] rounded-2xl border border-zinc-800 bg-zinc-900 text-zinc-100 shadow-2xl overflow-hidden">
            <div className="flex items-center justify-between px-5 py-3.5 border-b border-zinc-800">
              <span className="text-sm font-semibold tracking-tight text-zinc-100">Telegram Alerts</span>
              <button
                type="button"
                onClick={onClose}
                className="w-7 h-7 rounded-lg border border-zinc-800 bg-zinc-950/60 text-zinc-400 hover:text-zinc-100 flex items-center justify-center text-xs"
              >
                ✕
              </button>
            </div>
            <div className="p-5 flex gap-5 items-stretch">
              <div className="bg-white rounded-xl p-2 text-center flex-shrink-0 flex flex-col items-center justify-between shadow">
                <div
                  className="flex items-center justify-center"
                  dangerouslySetInnerHTML={{ __html: tgStatus?.qr_svg || "" }}
                />
                <div className="w-full border-t border-zinc-200 pt-1.5 mt-1">
                  <a
                    href={tgStatus?.bot_url || "/api/telegram/open"}
                    target="_blank"
                    rel="noreferrer"
                    className="text-[11.5px] font-semibold text-sky-600 hover:text-sky-700 block"
                  >
                    Open in Telegram ↗
                  </a>
                </div>
              </div>

              <div className="flex flex-col justify-between flex-1 py-0.5">
                <div className="flex flex-col gap-1.5">
                  <div className="text-[15px] font-bold text-zinc-100 leading-tight">Connect your phone</div>
                  <p className="text-xs text-zinc-400 leading-relaxed">
                    Scan the QR code and tap <strong className="text-zinc-200">Start</strong> in Telegram to receive instant OTA and security summaries.
                  </p>
                </div>

                <div className="flex flex-wrap gap-1.5 my-2.5">
                  {subs.length > 0 ? subs.map((s, i) => (
                    <span
                      key={i}
                      className="inline-flex items-center gap-1.5 text-[11.5px] font-semibold px-2.5 py-1 rounded-md bg-emerald-950/60 text-emerald-300 border border-emerald-500/30"
                    >
                      <span className="w-1.5 h-1.5 rounded-full bg-emerald-400" />
                      {s.name}
                    </span>
                  )) : (
                    <span className="text-xs text-zinc-500">No phone connected yet</span>
                  )}
                </div>

                <div className="flex flex-col gap-1.5">
                  <div className="flex gap-2 items-center">
                    <Button size="sm" variant="primary" onClick={onTestAlert} disabled={testing}>
                      <span>{testing ? "Sending..." : "Send Test Alert"}</span>
                    </Button>
                    <Button size="sm" variant="secondary" onClick={() => onRefresh(true, true)}>
                      <span>New QR</span>
                    </Button>
                  </div>
                  {testFeedback && (
                    <div className="font-mono text-[11px] text-emerald-400">{testFeedback}</div>
                  )}
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    }

    function Header({ currentView, setCurrentView, ecuState, tgStatus, onOpenTelegram }) {
      const scrollTo = (id) => {
        if (currentView !== "landing") {
          setCurrentView("landing");
          setTimeout(() => {
            const el = document.getElementById(id);
            if (el) el.scrollIntoView({ behavior: "smooth" });
          }, 60);
        } else {
          const el = document.getElementById(id);
          if (el) el.scrollIntoView({ behavior: "smooth" });
        }
      };

      const subCount = tgStatus?.subscriber_count ?? 1;

      return (
        <header className="fixed top-0 left-0 right-0 z-50 h-16 border-b border-zinc-800/80 bg-zinc-950/80 backdrop-blur-md px-6 lg:px-12">
          <div className="max-w-7xl mx-auto h-full flex items-center justify-between gap-4">
            
            {/* Brand + Status Pill */}
            <div className="flex items-center gap-4">
              <button
                type="button"
                onClick={() => setCurrentView("landing")}
                className="flex items-center gap-2.5 text-left group focus:outline-none"
              >
                <div className="p-1.5 rounded-lg bg-zinc-900 border border-zinc-800 group-hover:border-sky-500/40 transition-colors">
                  <ShieldLogo className="w-5 h-5" />
                </div>
                <span className="font-semibold text-sm tracking-tight text-zinc-100">
                  AutoQrypt
                </span>
              </button>

              <div className="hidden sm:flex items-center gap-2 rounded-full border border-zinc-800 bg-zinc-900/70 px-3 py-1 text-xs font-mono text-zinc-300 tabular-nums">
                <span className="w-2 h-2 rounded-full bg-emerald-400 pulse-dot" />
                <span>{ecuState?.app_version || "v1.0.0"}</span>
                <span className="text-zinc-600">·</span>
                <span className="text-zinc-400">{ecuState?.running_slot || "ota_0"}</span>
                <span className="text-zinc-600">·</span>
                <span className="text-emerald-400">SV {ecuState?.installed_security_version ?? 1}</span>
              </div>
            </div>

            {/* Section Links */}
            {currentView === "landing" && (
              <nav className="hidden md:flex items-center gap-6 text-xs font-medium text-zinc-400">
                <button type="button" onClick={() => scrollTo("architecture")} className="hover:text-zinc-100 transition-colors">
                  How It Works
                </button>
                <button type="button" onClick={() => scrollTo("threats")} className="hover:text-zinc-100 transition-colors">
                  Threat Defense
                </button>
                <button type="button" onClick={() => scrollTo("telemetry")} className="hover:text-zinc-100 transition-colors">
                  Silicon Graphs
                </button>
              </nav>
            )}

            {/* Telegram + View Switcher */}
            <div className="flex items-center gap-2.5">
              <button
                type="button"
                onClick={onOpenTelegram}
                className="inline-flex items-center gap-2 rounded-lg border border-zinc-800 bg-zinc-900/90 hover:bg-zinc-800/80 hover:border-zinc-700 px-3 py-1.5 text-xs font-semibold text-zinc-100 transition-all"
              >
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" className="text-sky-400">
                  <path d="M21.4 2.6L2.7 9.8c-1.2.5-1.2 1.2-.2 1.5l4.8 1.5 11.1-7c.5-.3 1-.1.6.2l-9 8.1-.3 4.9c.5 0 .7-.2 1-.5l2.3-2.2 4.8 3.5c.9.5 1.5.2 1.7-.8L22.7 4c.3-1.2-.5-1.8-1.3-1.4z" fill="currentColor"/>
                </svg>
                <span>Telegram</span>
                <span className="text-zinc-600">·</span>
                <span className="font-mono text-[11px] text-emerald-400">{subCount} Live</span>
              </button>

              {currentView === "landing" ? (
                <Button size="sm" variant="primary" onClick={() => setCurrentView("testbench")}>
                  <span>HIL Test Bench</span>
                  <IconArrowRight className="w-3.5 h-3.5" />
                </Button>
              ) : (
                <Button size="sm" variant="secondary" onClick={() => setCurrentView("landing")}>
                  <span>← Back to Overview</span>
                </Button>
              )}
            </div>

          </div>
        </header>
      );
    }

    // =========================================================================
    // 4. LANDING PAGE (DISTINCT SCROLL-ANIMATED SECTIONS, NO BIG HERO BOX)
    // =========================================================================
    function LandingPage({ setCurrentView, simMode, setSimMode, onQuickAttack }) {
      const [activeArchStep, setActiveArchStep] = useState(0);
      const [chartMetric, setChartMetric] = useState("ms");
      const [telemetryInView, setTelemetryInView] = useState(false);

      // Scroll-triggered IntersectionObserver for all reveal animations
      useEffect(() => {
        const els = document.querySelectorAll(
          ".reveal-slide-up, .reveal-slide-left, .reveal-slide-right, .reveal-strip, .reveal-pop"
        );
        const io = new IntersectionObserver(
          (entries) => {
            entries.forEach((entry) => {
              if (entry.isIntersecting) {
                entry.target.classList.add("is-visible");
                if (entry.target.id === "telemetry-graphs") {
                  setTelemetryInView(true);
                }
              }
            });
          },
          { threshold: 0.14, rootMargin: "0px 0px -40px 0px" }
        );
        els.forEach((el) => io.observe(el));
        return () => io.disconnect();
      }, []);

      const simScenarios = {
        valid: {
          badge: "ACCEPTED · 71.4 ms",
          badgeVariant: "emerald",
          slot: "ota_0 → ota_1",
          conduitColor: "from-sky-400 via-emerald-400 to-emerald-500",
          gates: [
            { name: "Falcon-512", status: "PASS", detail: "4.9 ms" },
            { name: "ML-DSA-44", status: "PASS", detail: "17.7 ms" },
            { name: "NVS SV > 1", status: "PASS", detail: "0.3 ms" },
            { name: "SHA3-256", status: "PASS", detail: "14.8 ms" },
          ]
        },
        quantum: {
          badge: "REJECTED · GATE 02",
          badgeVariant: "red",
          slot: "ota_0 Kept",
          conduitColor: "from-sky-400 via-red-500 to-zinc-800",
          gates: [
            { name: "Falcon-512", status: "PASS", detail: "4.9 ms" },
            { name: "ML-DSA-44", status: "FAIL", detail: "17.6 ms" },
            { name: "NVS Counter", status: "HALT", detail: "—" },
            { name: "SHA3-256", status: "HALT", detail: "0 B" },
          ]
        },
        rollback: {
          badge: "REJECTED · GATE 01",
          badgeVariant: "amber",
          slot: "ota_0 Kept",
          conduitColor: "from-amber-400 via-red-500 to-zinc-800",
          gates: [
            { name: "NVS SV <= 2", status: "FAIL", detail: "0.3 ms" },
            { name: "Falcon-512", status: "HALT", detail: "—" },
            { name: "ML-DSA-44", status: "HALT", detail: "—" },
            { name: "SHA3-256", status: "HALT", detail: "0 B" },
          ]
        }
      };

      const archSteps = [
        {
          step: "01",
          title: "QpiAI Quantum Entropy Seed",
          tag: "8-Qubit Hadamard Circuit",
          badge: "purple",
          desc: "An 8-qubit superposition circuit on QpiAI QCloud generates true quantum randomness mixed with hardware entropy to seed all OEM keys.",
          statLabel: "Root Entropy",
          statValue: "256-bit SHA3-256",
          activeSegment: 0
        },
        {
          step: "02",
          title: "Air-Gapped OEM Dual Signing",
          tag: "ML-DSA-44 + Ed25519",
          badge: "sky",
          desc: "The firmware binary is hashed with SHA3-256 and dual-signed offline using NIST FIPS 204 ML-DSA-44 (post-quantum) and Ed25519 (classical backup).",
          statLabel: "Hybrid Signature",
          statValue: "2,420 B + 64 B",
          activeSegment: 3
        },

        if (initialAttack) setAttackVector(initialAttack);
      }, [initialAttack]);

      useEffect(() => {
        fetch("/api/status")
          .then(res => res.json())
          .then(data => { if (data.history) setHistory(data.history); })
          .catch(console.error);
      }, []);

      const attackVectors = [
        { id: "flipped_byte", label: "Tampered firmware bit (SHA3-256 mismatch)" },
        { id: "forged_mldsa", label: "Forged ML-DSA-44 signature (Rogue key)" },
        { id: "v1_downgrade", label: "Monotonic downgrade replay (v1.0.0)" },

        if (refreshStatus) refreshStatus();
        const statRes = await fetch("/api/status");

        if (statData.history) setHistory(statData.history);
      };

        setBusy(true);
        setWaypointStatuses(["active", "idle", "idle", "idle", "idle"]);
        try {
          const res = await fetch("/api/update", {
            method: "POST",
            headers: { "X-AutoQrypt": "1", "Content-Type": "application/json" },
            body: JSON.stringify({ image: updateType })
          });
          const result = await res.json();
          setLastResult(result);

          if (result.decision === "ACCEPT" && !result.rollback_triggered) {
            setWaypointStatuses(["passed", "passed", "passed", "passed", "passed"]);
          } else if (result.rollback_triggered) {
            setWaypointStatuses(["passed", "passed", "passed", "passed", "failed"]);
          } else {
            setWaypointStatuses(["failed", "idle", "idle", "idle", "idle"]);
          }
          await syncStatus();
        } finally {
          setBusy(false);
        }
      };

      const handleAttack = async () => {
        setBusy(true);
        setWaypointStatuses(["active", "idle", "idle", "idle", "idle"]);
        try {
          const res = await fetch("/api/attack", {
            method: "POST",
            headers: { "X-AutoQrypt": "1", "Content-Type": "application/json" },
            body: JSON.stringify({ attack: attackVector })
          });
          const result = await res.json();
          setLastResult(result);

          const reason = result.reason || "";
          if (reason.includes("MANIFEST") || reason.includes("TARGET") || reason.includes("KEY_ID")) {
            setWaypointStatuses(["failed", "idle", "idle", "idle", "idle"]);
          } else if (reason.includes("ROLLBACK")) {
            setWaypointStatuses(["passed", "failed", "idle", "idle", "idle"]);
          } else if (reason.includes("DIRECTOR") || reason.includes("FALCON")) {
            setWaypointStatuses(["passed", "passed", "failed", "idle", "idle"]);
          } else if (reason.includes("IMAGE") || reason.includes("MLDSA") || reason.includes("ED25519")) {
            setWaypointStatuses(["passed", "passed", "passed", "failed", "idle"]);
          } else {
            setWaypointStatuses(["passed", "passed", "passed", "passed", "failed"]);
          }
          await syncStatus();
        } finally {
          setBusy(false);
        }
      };

          method: "POST",
          headers: { "X-AutoQrypt": "1" }

            </div>
            <div className="flex items-center gap-2.5">
              <Button size="sm" variant="secondary" onClick={handleReset}>
                Reset Factory State
              </Button>
              <Button size="sm" variant="secondary" onClick={() => setCurrentView("landing")}>
                ← Overview
              </Button>
            </div>
          </div>

          <div className="grid grid-cols-2 lg:grid-cols-4 gap-4 mt-6">
            <Card className="p-4">
              <div className="text-xs font-mono text-zinc-500">RUNNING FIRMWARE</div>
              <div className="text-xl font-bold font-mono text-zinc-100 mt-1 tabular-nums">
                {ecuState?.app_version || "v1.0.0"}
              </div>
              <div className="text-[11px] font-mono text-zinc-400 mt-1">
                Active Slot: <span className="text-sky-400">{ecuState?.running_slot || "ota_0"}</span>
              </div>
            </Card>

            <Card className="p-4">
              <div className="text-xs font-mono text-zinc-500">SECURITY COUNTER</div>

              </div>
              <div className="text-[11px] font-mono text-zinc-400 mt-1">
                NVS Anti-Rollback: <span className="text-emerald-400">Armed</span>
              </div>
            </Card>

            <Card className="p-4">
              <div className="text-xs font-mono text-zinc-500">HYBRID 2FA SUITE</div>
              <div className="text-base font-semibold text-zinc-100 mt-1 truncate">
                FIPS 204 ML-DSA-44
              </div>
              <div className="text-[11px] font-mono text-zinc-400 mt-1 truncate">
                + Ed25519 + Falcon-512
              </div>
            </Card>

            <Card className="p-4">
              <div className="text-xs font-mono text-zinc-500">TASK STACK PEAK</div>
              <div className="text-xl font-bold font-mono text-zinc-100 mt-1 tabular-nums">
                36.5 KB
              </div>
              <div className="text-[11px] font-mono text-zinc-400 mt-1 tabular-nums">

          )}

          <Card className="mt-6 p-6 overflow-hidden">
            <div className="flex items-center justify-between mb-4">
              <span className="font-mono text-xs font-semibold text-zinc-400">SECURITY AUDIT LEDGER</span>
              <Badge variant="default">{history.length} TRANSACTIONS</Badge>
            </div>

            <div className="overflow-x-auto">
              <table className="w-full text-left text-xs font-mono tabular-nums">
                <thead>
                  <tr className="border-b border-zinc-800 text-zinc-500">
                    <th className="pb-2.5 font-normal">TIME</th>
                    <th className="pb-2.5 font-normal">EVENT / VECTOR</th>
                    <th className="pb-2.5 font-normal">DECISION</th>
                    <th className="pb-2.5 font-normal">REASON</th>
                    <th className="pb-2.5 font-normal text-right">ELAPSED</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-zinc-800/60">
                  {history.length === 0 ? (
                    <tr>
                      <td colSpan="5" className="py-6 text-center text-zinc-500 font-sans">
                        No transactions recorded yet. Dispatch an update or launch an adversarial vector above.
                      </td>
                    </tr>
                  ) : (
                    history.slice().reverse().map((h, idx) => {
                      const ok = h.decision === "ACCEPT" && !h.rollback_triggered;
                      const isRb = h.rollback_triggered === true;
                      return (
                        <tr key={idx} className="hover:bg-zinc-800/20">
                          <td className="py-2.5 text-zinc-400">{h.time}</td>
                          <td className="py-2.5 text-zinc-200 font-sans font-medium">{h.title}</td>
                          <td className="py-2.5">
                            <Badge variant={ok ? "emerald" : (isRb ? "amber" : "red")}>
                              {ok ? "ACCEPTED" : (isRb ? "ROLLED BACK" : "REJECTED")}
                            </Badge>
                          </td>
                          <td className="py-2.5 text-zinc-400">{h.reason}</td>
                          <td className="py-2.5 text-right text-zinc-400">
                            {h.elapsed_s != null ? `${h.elapsed_s} s` : "--"}
                          </td>
                        </tr>
                      );
                    })
                  )}
                </tbody>
              </table>
            </div>
          </Card>

        </div>
      );
    }

    // =========================================================================
    // 6. ROOT APPLICATION
    // =========================================================================
    function App() {
      const [currentView, setCurrentView] = useState(() =>
        window.location.hash === "#test-bench" ? "testbench" : "landing"
      );
      const [ecuState, setEcuState] = useState(null);
      const [simMode, setSimMode] = useState("valid");
      const [initialAttack, setInitialAttack] = useState("flipped_byte");
      const [tgOpen, setTgOpen] = useState(false);
      const [tgStatus, setTgStatus] = useState(null);
      const [tgTesting, setTgTesting] = useState(false);
      const [tgFeedback, setTgFeedback] = useState("");

      const fetchTelegram = (showFeedback = false, newQr = false) => {
        let url = "/api/telegram/status";
        if (showFeedback && newQr) url += "?sync=1&new_qr=1";
        else if (showFeedback) url += "?sync=1";
        else if (newQr) url += "?new_qr=1";
        fetch(url)
          .then(res => res.json())
          .then(data => {
            setTgStatus(data);
            if (showFeedback) {
              setTgFeedback(newQr ? `Generated new QR (#${data.pair_token || "NEW"})` : `Synced (${data.subscriber_count || 0} connected)`);
            }
          })
          .catch(() => {});
      };

      const handleOpenTelegram = () => {
        setTgFeedback("");
        setTgOpen(true);
        fetchTelegram(false, true);
      };

      const handleTestTelegram = () => {
        setTgTesting(true);
        setTgFeedback("Sending test alert...");
        fetch("/api/telegram/test", { method: "POST", headers: { "X-AutoQrypt": "1" } })
          .then(res => res.json())
          .then(data => {
            if (data.status) setTgStatus(data.status);
            setTgFeedback(data.ok ? "Test alert sent to your phone" : "Could not send (tap Start in Telegram first)");
          })
          .catch(() => setTgFeedback("Server unreachable"))
          .finally(() => setTgTesting(false));
      };

      const fetchStatus = () => {
        fetch("/api/status")
          .then(res => res.json())
          .then(data => { if (data.ecu) setEcuState(data.ecu); })
          .catch(console.error);
        fetchTelegram(false, false);
      };

      useEffect(() => {
        fetchStatus();
        const interval = setInterval(fetchStatus, 3000);
        return () => clearInterval(interval);
      }, []);

      const setView = (v) => {
        setCurrentView(v);
        window.location.hash = v === "testbench" ? "test-bench" : "";
        window.scrollTo({ top: 0, behavior: "smooth" });
      };

      const handleQuickAttack = (attackId) => {
        setInitialAttack(attackId);
        setView("testbench");
      };

      return (
        <div className="min-h-screen bg-zinc-950 text-zinc-100 flex flex-col font-sans relative">
          <Header
            currentView={currentView}
            setCurrentView={setView}
            ecuState={ecuState}
            tgStatus={tgStatus}
            onOpenTelegram={handleOpenTelegram}
          />
          <TelegramModal
            open={tgOpen}
            onClose={() => setTgOpen(false)}
            tgStatus={tgStatus}
            onRefresh={fetchTelegram}
            onTestAlert={handleTestTelegram}
            testFeedback={tgFeedback}
            testing={tgTesting}
          />
          <main className="flex-1">
            {currentView === "landing" ? (
              <LandingPage
                setCurrentView={setView}
                simMode={simMode}
                setSimMode={setSimMode}
                onQuickAttack={handleQuickAttack}
              />
            ) : (
              <TestBenchPage
                setCurrentView={setView}
                ecuState={ecuState}
                refreshStatus={fetchStatus}
                initialAttack={initialAttack}
              />
            )}
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
